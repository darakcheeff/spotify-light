name: Build Debian/Mint Package

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Package Version'
        required: true
        default: '0.1.0'

jobs:
  build-deb:
    name: Build Universal DEB (glibc 2.31 Compatible)
    runs-on: ubuntu-latest
    container:
      image: debian:bullseye-slim # Pinned glibc 2.31 for universal Debian 11/12/13 and Linux Mint 20/21/22 support

    steps:
      - name: Install System Dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            git \
            pkg-config \
            libssl-dev \
            libasound2-dev \
            libpulse-dev \
            libdbus-1-dev \
            libfontconfig1-dev \
            ca-certificates

      - name: Install Rust Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Release Binary
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release
          strip target/release/spotify-light

      - name: Assemble DEB Package
        run: |
          VERSION="${{ github.event.inputs.release_version }}"
          PKG_DIR="spotify-light_${VERSION}_amd64"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/icons/hicolor/scalable/apps"

          # Copy binary
          cp target/release/spotify-light "${PKG_DIR}/usr/bin/spotify-light"
          chmod 755 "${PKG_DIR}/usr/bin/spotify-light"

          # Copy desktop entry
          cp packaging/debian/spotify-light.desktop "${PKG_DIR}/usr/share/applications/spotify-light.desktop"

          # Create placeholder icon
          cat << 'EOF' > "${PKG_DIR}/usr/share/icons/hicolor/scalable/apps/spotify-light.svg"
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="48" fill="#1DB954"/>
            <path d="M25 40 C 45 32, 65 35, 78 43" stroke="#121212" stroke-width="8" stroke-linecap="round" fill="none"/>
            <path d="M28 52 C 45 46, 62 48, 74 55" stroke="#121212" stroke-width="7" stroke-linecap="round" fill="none"/>
            <path d="M32 64 C 45 60, 58 61, 68 67" stroke="#121212" stroke-width="6" stroke-linecap="round" fill="none"/>
          </svg>
          EOF

          # Generate DEBIAN/control
          cat << EOF > "${PKG_DIR}/DEBIAN/control"
          Package: spotify-light
          Version: ${VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Depends: libc6 (>= 2.31), libasound2, libpulse0, libdbus-1-3
          Maintainer: darakcheeff <darakcheeff@users.noreply.github.com>
          Description: Lightweight, native Spotify client for Linux
           SpotifyLight is an ultra-fast, minimalist Spotify desktop player
           built with Rust and Slint. Free of Electron and WebViews, it provides
           instant startup, negligible CPU footprint, and native MPRIS2 desktop
           integration for Debian and Linux Mint.
          EOF

          # Build .deb
          dpkg-deb --build "${PKG_DIR}"
          echo "Built package: ${PKG_DIR}.deb"

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spotify-light-deb
          path: spotify-light_*.deb
